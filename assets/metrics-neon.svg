<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="title desc">
  <title id="title">FSNABAJURA profile metrics</title>
  <desc id="desc">More than 1.3 thousand contributions, more than 38 repositories, three shipping products, and six core technologies.</desc>
  <defs>
    <linearGradient id="stroke" x1="0" x2="1"><stop stop-color="#00E5FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="190" rx="18" fill="#050816"/>
  <rect x="1" y="1" width="1278" height="188" rx="17" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path d="M320 30V160M640 30V160M960 30V160" stroke="#334155"/>
  <path d="M42 26H1238" stroke="url(#stroke)" stroke-width="2" stroke-dasharray="6 16" opacity=".7">
    <animate attributeName="stroke-dashoffset" values="0;-220" dur="7s" repeatCount="indefinite"/>
  </path>
  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(160 0)"><text y="103" fill="#F8FAFC" font-size="48" font-weight="800">1.3K+</text><text y="137" fill="#67E8F9" font-size="13" letter-spacing="3">CONTRIBUTIONS</text></g>
    <g transform="translate(480 0)"><text y="103" fill="#F8FAFC" font-size="48" font-weight="800">38+</text><text y="137" fill="#A78BFA" font-size="13" letter-spacing="3">REPOSITORIES</text></g>
    <g transform="translate(800 0)"><text y="103" fill="#F8FAFC" font-size="48" font-weight="800">03</text><text y="137" fill="#4ADE80" font-size="13" letter-spacing="3">PRODUCTS SHIPPING</text></g>
    <g transform="translate(1120 0)"><text y="103" fill="#F8FAFC" font-size="48" font-weight="800">06</text><text y="137" fill="#67E8F9" font-size="13" letter-spacing="3">CORE TECHNOLOGIES</text></g>
  </g>
  <g fill="#00E5FF" filter="url(#glow)">
    <circle cx="160" cy="42" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="42" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="42" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="42" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
